name: CI

on:
  pull_request:
    branches: [main]
  # Squash is disabled on this repo, so every landing is a merge commit. A
  # pull request's green is a claim about its own head; without this trigger
  # no job had ever run against `main` itself, and a merge that bypassed the
  # branch ruleset — an override, a direct push — left no result at all.
  push:
    branches: [main]
  workflow_call:

# `dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1` reads the PR's changed files via the GitHub
# `listFiles` API, which needs `pull-requests: read`. The repo default
# token only grants `contents/metadata/packages: read`, so without this
# block the detect-changes job fails with "Resource not accessible by
# integration".
permissions:
  contents: read
  pull-requests: read

# Cancel in-flight CI runs for the same ref when a new push lands.
# Intentionally not applied to workflow_call — deploy depends on CI
# completing; cancelling mid-flight would race the deploy.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Path-filter up front so downstream jobs only run when relevant.
  # `code` = anything that could affect runtime behaviour (source files
  # under apps/ or packages/, plus scripts/). `deps` = lockfile or any
  # manifest / linter-config change. Each package has its own filter so
  # the test job can scope `bun test` to just the touched packages.
  detect-changes:
    name: Detect changes
    runs-on: ubuntu-latest
    # PATH FILTERING IS A PULL-REQUEST-ONLY OPTIMISATION. A filter needs a base
    # to diff against, and `pull_request` is the only event here that has one:
    # on anything else every output is forced to `true` and the filter step does
    # not run, so a `main` push builds the merged tree in full.
    #
    # THE ALTERNATIVE IS A FALSE GREEN, NOT A NARROWER RUN.
    # `dorny/paths-filter` reads `github.event.before` only when the event name
    # is literally `push`; on any other event it falls back to
    # `getChangesInLastCommit()`, which runs
    # `git log --format= --no-renames --name-status -n 1`. git prints no diff
    # for a merge commit under `git log` — measured on a real landing here, 0
    # lines against 4 for the equivalent `git diff <before>..<merge>`. Zero
    # lines is every filter `false`, every dependent job `skipped`, and a green
    # run that built nothing. Forcing the outputs makes that branch unreachable
    # rather than betting on which one runs.
    outputs:
      code: ${{ github.event_name != 'pull_request' || steps.filter.outputs.code == 'true' }}
      deps: ${{ github.event_name != 'pull_request' || steps.filter.outputs.deps == 'true' }}
      docs: ${{ github.event_name != 'pull_request' || steps.filter.outputs.docs == 'true' }}
      prod-guards: ${{ github.event_name != 'pull_request' || steps.filter.outputs.prod-guards == 'true' }}
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          fetch-depth: 2
      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        id: filter
        if: ${{ github.event_name == 'pull_request' }}
        with:
          list-files: none
          filters: |
            code:
              - 'apps/**/*.ts'
              - 'apps/**/*.tsx'
              - 'apps/**/*.js'
              - 'apps/**/*.jsx'
              - 'apps/**/*.mjs'
              - 'apps/**/*.cjs'
              - 'apps/**/*.json'
              - 'apps/**/*.css'
              - 'apps/**/*.html'
              - 'packages/**/*.ts'
              - 'packages/**/*.tsx'
              - 'packages/**/*.js'
              - 'packages/**/*.mjs'
              - 'packages/**/*.cjs'
              - 'packages/**/*.json'
              - 'packages/**/*.sql'
              - 'scripts/**'
              - 'tsconfig*.json'
            deps:
              - 'package.json'
              - 'bun.lock'
              - 'apps/*/*/package.json'
              - 'packages/*/*/package.json'
              - 'biome.json'
              - 'biome.jsonc'
              - 'knip.json'
              - 'knip.jsonc'
              - 'knip.ts'
            docs:
              # The docs drift-check (scripts/check-docs.ts) re-derives
              # router lists, cron schedules, provider directories, and
              # env-var coverage from source and diffs against the docs.
              # Run whenever EITHER side could have moved.
              - 'apps/frontend/docs/src/content/docs/reference/**'
              - 'apps/backend/worker/README.md'
              - '.env.example'
              - 'apps/backend/api/src/presentation/router*.ts'
              - 'apps/backend/api/src/presentation/routers/**'
              - 'apps/backend/data-provider/src/presentation/router*.ts'
              - 'apps/backend/data-provider/src/presentation/routers/**'
              - 'apps/backend/worker/src/processors/**'
              - 'packages/business/jobs/src/scheduled-jobs/**'
              - 'packages/business/jobs/src/user-jobs/**'
              - 'packages/clients/providers/src/providers/**'
              - 'scripts/check-docs.ts'
            # BEGIN auto:filters (generated by scripts/generate-ci-filters.ts — do not edit)
            cloud-client:
              - 'packages/clients/cloud-client/**'
            config:
              - 'packages/infra/config/**'
            db:
              - 'packages/infra/db/**'
            deadline:
              - 'packages/infra/deadline/**'
            domain:
              - 'packages/business/domain/**'
            email:
              - 'packages/infra/email/**'
            file-import:
              - 'packages/business/file-import/**'
            http-fetch:
              - 'packages/infra/http-fetch/**'
            ingesters:
              - 'packages/business/ingesters/**'
            jobs:
              - 'packages/business/jobs/**'
            logging:
              - 'packages/infra/logging/**'
            providers:
              - 'packages/clients/providers/**'
            providers-google-sheets:
              - 'packages/clients/providers-google-sheets/**'
            push:
              - 'packages/infra/push/**'
            queue:
              - 'packages/infra/queue/**'
            rate-limiter:
              - 'packages/infra/rate-limiter/**'
            realtime:
              - 'packages/infra/realtime/**'
            security:
              - 'packages/infra/security/**'
            shared:
              - 'packages/business/shared/**'
            storage:
              - 'packages/infra/storage/**'
            ui:
              - 'packages/frontend/ui/**'
            # END auto:filters
            data-provider:
              - 'apps/backend/data-provider/**'
            # Compiled-binary production guards live in @scani/config (the
            # getNodeEnv helper that defeats `bun build --compile --minify`
            # NODE_ENV substitution), @scani/cloud-client (https-in-prod
            # SCANI_CLOUD_URL check), and @scani/logging (LOG_ID_PEPPER
            # required-in-prod). Any change to those, the api Dockerfile,
            # or the api build script means the integration test below must
            # re-run from a fresh image.
            prod-guards:
              - 'packages/infra/config/**'
              - 'packages/clients/cloud-client/**'
              - 'packages/infra/logging/**'
              - 'packages/business/shared/src/utils/encryption.ts'
              - 'apps/backend/api/Dockerfile'
              - 'apps/backend/api/package.json'
              - 'apps/backend/api/src/config/**'
              - '.github/workflows/ci.yml'

  validate-code:
    name: Lint & Type Check
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.code == 'true' || needs.detect-changes.outputs.deps == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
      - uses: ./.github/actions/setup-bun
      - name: Lint
        run: bun run lint
      - name: Type check
        run: bun run type-check

  # Also gated on `code`, not just `deps`: knip's unused-FILE check is the only
  # thing that sees a module nothing imports, and the change that creates one —
  # or that should have deleted one — is a source change with no manifest in it.
  # Gated on `deps` alone this job never ran on the change that mattered.
  validate-deps:
    name: Deps sync & dead code (knip)
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.deps == 'true' || needs.detect-changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
      - uses: ./.github/actions/setup-bun
      - name: Dependency versions in sync
        run: bun run deps:lint
      - name: Unused files & dependencies (knip)
        run: bun run deps:unused
      - name: CI filter list in sync with workspaces
        run: bun run ci:gen:check

  validate-docs:
    name: Docs in sync with source
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.docs == 'true' || needs.detect-changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
      - uses: ./.github/actions/setup-bun
      # scripts/check-docs.ts re-derives router lists, cron schedules,
      # provider directories, and env-var coverage from source and
      # compares against the published docs. Errors fail the build;
      # warnings (env-var coverage) print but don't block.
      - name: Check docs/source drift
        run: bun run docs:check

  test:
    name: Test
    needs: detect-changes
    # Run the full repo suite whenever any code or dependency changed.
    # The suite finishes in ~13s on the GH runner — much cheaper than
    # the per-package scoping it replaced, and immune to "PR only touches
    # apps/backend/api so test job skips entirely" gaps.
    if: ${{ needs.detect-changes.outputs.code == 'true' || needs.detect-changes.outputs.deps == 'true' }}
    runs-on: ubuntu-latest
    # Postgres is only booted when this job runs. `withTestDb` wraps each
    # test in a rolled-back transaction so tests share the schema but not
    # state. Redis is not needed — the rate-limiter falls through to its
    # in-memory queue when `sharedRedis` is unset.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: scani
          POSTGRES_PASSWORD: scani
          POSTGRES_DB: scani
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U scani -d scani"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
      - uses: ./.github/actions/setup-bun
      - name: Run DB migrations
        # Seeds the schema + all required lookup rows (institutions,
        # institution_blockchain_mappings, token types) that repository
        # tests assume are present.
        run: bun run db:migrate
        env:
          DATABASE_URL: postgres://scani:scani@localhost:5433/scani?sslmode=disable
      - name: Test
        # Preload + timeout come from `bunfig.toml` at the repo root —
        # the package.json `test` script restates them for clarity.
        run: bun run test
        env:
          NODE_ENV: test
          DATABASE_URL: postgres://scani:scani@localhost:5433/scani?sslmode=disable

  e2e:
    # Full Playwright suite against the real docker-compose stack
    # (api + worker + data-provider + frontend + Postgres + Redis +
    # Mailpit + MinIO). Bypasses the `scripts/run.ts` orchestrator and
    # invokes `bunx playwright test` directly so the cache + artifact
    # steps can sit between stack-up and the test run — the orchestrator
    # would otherwise try to tear down a stack CI already owns.
    # STUB_AI=1 short-circuits OpenAI/Perplexity/DeepSeek calls in the
    # data-provider so screenshot-parse + AI-touching specs are
    # deterministic and don't need network keys.
    # STUB_CHAIN_DATA=1 does the same for chains. Without it the
    # wallet-import spec imported the Bitcoin genesis address from LIVE
    # blockchain.info, so this required job — `CI Success` is gated on it,
    # and the ruleset is gated on `CI Success` — depended on a third
    # party's rate limiter and the runner's IP luck (SC-490).
    name: E2E (Playwright)
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      COMPOSE_PROJECT_NAME: mgrin-e2e-suite
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
      - uses: ./.github/actions/setup-bun

      - name: Cache Playwright browsers
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('apps/e2e/package.json') }}

      - name: Install Playwright Chromium + WebKit
        run: cd apps/e2e && bunx playwright install --with-deps chromium webkit

      - name: Start stack
        run: cp .env.example .env && bun dev:stack
        env:
          STUB_AI: "1"
          STUB_CHAIN_DATA: "1"

      # `docker compose up` reports only `service "x" didn't complete
      # successfully: exit 1` and discards the container's own output, so a
      # failure here is undiagnosable from the run log alone — which is exactly
      # what happened to `migrate` on 2026-08-15. Dump the one-shot containers
      # when the stack fails to come up.
      - name: Stack logs (on failure)
        if: failure()
        run: docker compose --profile full logs --no-color migrate deps env-sync minio-init || true

      - name: Wait for stack health
        run: bun apps/e2e/scripts/wait-for-stack.ts

      # SC-494. This step runs playwright DIRECTLY rather than through
      # `apps/e2e/scripts/run.ts`, so the runner's stack-discovery never
      # happens here and `fixtures/db.ts` has nothing to read. It used to work
      # by accident: the fixture's hardcoded fallbacks were
      # `mgrin-e2e-suite-postgres-1` and `scani`, which are exactly what CI
      # produces — correct here and silently wrong in every checkout that is
      # not this job.
      #
      # So CI declares them, and derives the container from the project name it
      # already sets rather than repeating the literal. There is no default to
      # fall back on any more: the fixture refuses and says NO QUERY WAS MADE.
      - name: Run Playwright suite
        run: cd apps/e2e && bunx playwright test
        env:
          CI: "true"
          PLAYWRIGHT_BASE_URL: http://localhost:5173
          POSTGRES_CONTAINER: ${{ env.COMPOSE_PROJECT_NAME }}-postgres-1
          # compose's `POSTGRES_DB`, and this repo sets no `SCANI_DEV_DB`.
          E2E_DB_NAME: scani
          API_BASE_URL: http://localhost:3011
          MAILPIT_URL: http://localhost:8026
          DATABASE_URL: postgres://scani:scani@localhost:5433/scani?sslmode=disable

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: apps/e2e/playwright-report/
          retention-days: 7

      - name: Stop stack
        if: always()
        run: docker compose --profile full down -v

  prod-guards-integration:
    # Builds the api binary via the production Dockerfile and asserts
    # that compile-time NODE_ENV substitution can't disable the
    # `https://` requirement on SCANI_CLOUD_URL or the LOG_ID_PEPPER
    # required-in-prod check. This is the regression test for X-1: bun
    # build --compile --minify previously folded `process.env.NODE_ENV`
    # to its build-time value, leaving every production guard dead in
    # the artifact OSS users actually consume. Unit tests can't catch
    # this — they run under the bun interpreter, not the compiled
    # binary — so we have to bake an image and run it.
    name: Prod-guards integration (compiled api)
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.prod-guards == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0

      - name: Build api image (no cache, to catch substitution regressions)
        run: docker build --no-cache -f apps/backend/api/Dockerfile -t scani/api:ci-verify .

      - name: Start isolated Postgres + Redis on a dedicated network
        run: |
          set -euo pipefail
          docker network create x1-ci
          docker run -d --name x1-pg --network x1-ci \
            -e POSTGRES_USER=scani -e POSTGRES_PASSWORD=scani -e POSTGRES_DB=scani \
            postgres:16-alpine
          docker run -d --name x1-redis --network x1-ci redis:7-alpine
          until docker exec x1-pg pg_isready -U scani 2>/dev/null | grep -q accepting; do
            sleep 1
          done

      - name: Assert api rejects http:// public SCANI_CLOUD_URL in production
        run: |
          set -euo pipefail
          set +e
          docker run --rm --network x1-ci \
            -e NODE_ENV=production \
            -e DATABASE_URL='postgres://scani:scani@x1-pg:5432/scani?sslmode=disable' \
            -e REDIS_URL=redis://x1-redis:6379 \
            -e FRONTEND_URL=https://example.com \
            -e BACKEND_URL=https://example.com/api \
            -e "BETTER_AUTH_SECRET=$(openssl rand -hex 32)" \
            -e "ENCRYPTION_KEY=$(openssl rand -hex 16)" \
            -e "JOBS_HMAC_SECRET=$(openssl rand -hex 32)" \
            -e "LOG_ID_PEPPER=$(openssl rand -hex 32)" \
            -e "SCANI_CLOUD_API_KEY=$(openssl rand -hex 32)" \
            -e 'SCANI_CLOUD_URL=http://public.example.com:8082' \
            -e PORT=3001 -e SERVICE_NAME=api \
            scani/api:ci-verify > out.log 2>&1
          status=$?
          set -e
          echo "::group::api output"
          cat out.log
          echo "::endgroup::"
          if [ "$status" -eq 0 ]; then
            echo "::error::api booted successfully with http://public.example.com:8082 in NODE_ENV=production. The X-1 NODE_ENV-substitution regression is back."
            exit 1
          fi
          if ! grep -q '@scani/cloud-client env misconfigured' out.log; then
            echo "::error::api crashed but not with the expected cloud-client misconfigured error — investigate."
            exit 1
          fi
          if ! grep -q 'must use https:// in production' out.log; then
            echo "::error::Missing the 'must use https:// in production' phrase in the error — the schema may have drifted."
            exit 1
          fi
          echo "✅ api correctly rejected http://public.example.com:8082"

      - name: Assert api rejects missing LOG_ID_PEPPER in production
        run: |
          set -euo pipefail
          set +e
          docker run --rm --network x1-ci \
            -e NODE_ENV=production \
            -e DATABASE_URL='postgres://scani:scani@x1-pg:5432/scani?sslmode=disable' \
            -e REDIS_URL=redis://x1-redis:6379 \
            -e FRONTEND_URL=https://example.com \
            -e BACKEND_URL=https://example.com/api \
            -e "BETTER_AUTH_SECRET=$(openssl rand -hex 32)" \
            -e "ENCRYPTION_KEY=$(openssl rand -hex 16)" \
            -e "JOBS_HMAC_SECRET=$(openssl rand -hex 32)" \
            -e "SCANI_CLOUD_API_KEY=$(openssl rand -hex 32)" \
            -e 'SCANI_CLOUD_URL=https://data-provider.example.com' \
            -e PORT=3001 -e SERVICE_NAME=api \
            scani/api:ci-verify > out.log 2>&1
          status=$?
          set -e
          echo "::group::api output"
          cat out.log
          echo "::endgroup::"
          if [ "$status" -eq 0 ]; then
            echo "::error::api booted successfully without LOG_ID_PEPPER in NODE_ENV=production."
            exit 1
          fi
          if ! grep -q 'LOG_ID_PEPPER' out.log; then
            echo "::error::api crashed but not with the expected LOG_ID_PEPPER error."
            exit 1
          fi
          echo "✅ api correctly rejected missing LOG_ID_PEPPER"

      - name: Tear down test infra
        if: always()
        run: |
          docker rm -f x1-pg x1-redis 2>/dev/null || true
          docker network rm x1-ci 2>/dev/null || true

  secret-scan:
    # Cheap + high-value: always runs so docs / workflow-only PRs can't
    # slip a leaked key through unchecked.
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
      - name: Secret scan
        run: |
          set -euo pipefail

          # Patterns target the actual secret shapes used in this monorepo.
          # When adding a new one: validate against a real value (rotate it
          # afterwards), test the regex doesn't fire on docs/test fixtures,
          # and prefer narrow shapes that won't fire on environment-variable
          # placeholder names in .env.example.
          PATTERNS=(
            # AWS access key + Render deploy hook
            'api\.render\.com/deploy/[A-Za-z0-9_-]+\?key=[A-Za-z0-9_-]{8,}'
            'AKIA[0-9A-Z]{16}'
            # Private keys (any flavor)
            '-----BEGIN (RSA |EC |OPENSSH |OPENPGP |)PRIVATE KEY-----'
            # Slack
            'xoxb-[0-9]+-[0-9]+-[A-Za-z0-9]+'
            # GitHub: classic + fine-grained PATs + OAuth/installation tokens
            'ghp_[A-Za-z0-9]{36,}'
            'github_pat_[A-Za-z0-9_]{82,}'
            'gho_[A-Za-z0-9]{36,}'
            'ghs_[A-Za-z0-9]{36,}'
            'ghu_[A-Za-z0-9]{36,}'
            # OpenAI + Anthropic API keys
            'sk-(proj-)?[A-Za-z0-9_\-]{40,}'
            'sk-ant-(api|sid)[0-9]{2}-[A-Za-z0-9_\-]{80,}'
            # Stripe live keys (test keys are sk_test_ — allow those)
            'sk_live_[0-9a-zA-Z]{24,}'
            'pk_live_[0-9a-zA-Z]{24,}'
            'rk_live_[0-9a-zA-Z]{24,}'
            # Sentry user + org auth tokens
            'sntrys_eyJ[A-Za-z0-9_\-]{40,}'
            'sntryu_[0-9a-f]{60,}'
            # Cloudflare API token (v4 shape)
            'cf_v1_[A-Za-z0-9_\-]{32,}'
            # Fastmail JMAP token (`fmu1-`/`fmm1-` prefix on token tokens)
            'fmu1-[a-zA-Z0-9]{6,}-[a-zA-Z0-9_-]+'
            'fmm1-[a-zA-Z0-9]{6,}-[a-zA-Z0-9_-]+'
            # Postgres connection string with credentials (Neon / generic)
            'postgres(ql)?://[A-Za-z0-9._%+\-]+:[^@\s/"<>]{8,}@[A-Za-z0-9._\-]+\.neon\.tech'
            'postgres(ql)?://[A-Za-z0-9._%+\-]+:[^@\s/"<>]{16,}@[A-Za-z0-9._\-]+'
            # Generic high-entropy JWT (kept tighter than before: at least
            # one dot before the long alphanum suffix)
            'eyJhbGciOi[A-Za-z0-9_\-]{40,}\.[A-Za-z0-9_\-]{40,}'
          )

          FAIL=0
          for p in "${PATTERNS[@]}"; do
            if grep -EnrI \
                --exclude-dir=node_modules \
                --exclude-dir=.git \
                --exclude-dir=dist \
                --exclude-dir=.next \
                --exclude-dir=docs \
                --exclude="bun.lock*" \
                --exclude="*.lock" \
                --exclude="*.map" \
                --exclude="*.min.js" \
                --exclude="*.test.ts" \
                --exclude="*.test.tsx" \
                --exclude=".env.example" \
                -e "$p" . ; then
              echo "::error::Potential secret matched pattern: $p"
              FAIL=1
            fi
          done

          if [ "$FAIL" -ne 0 ]; then
            echo "::error::Secret scan failed. Rotate the exposed value and remove it from the commit."
            exit 1
          fi

          echo "✅ No hardcoded secrets detected"

      # SC-658. THE GREP ABOVE PASSES `-I`, WHICH MEANS "SKIP BINARY FILES", AND A
      # SINGLE NUL BYTE MAKES A FILE BINARY. So a NUL-bearing file is not scanned
      # for secrets at all, and the skip is SILENT — indistinguishable from a
      # clean result. Measured on GNU grep 3.11: with `-I`, rc=1 and no output;
      # without it, grep reports `binary file matches`, which is enough for the
      # `if` above to fire.
      #
      # A NUL reaches a source file by accident more easily than it sounds: a
      # sentinel constant meant to hold a space held one, and biome, tsgo, the
      # test suite, the docs checks and the pre-commit hook were all green over
      # it. Only git objected, printing `Bin 0 -> 6170 bytes` for a `.ts` file.
      #
      # THE `-I` IS NOT THE BUG AND MUST NOT BE REMOVED. Dropping it makes this
      # job read every tracked image looking for key shapes, and a scan that
      # false-positives is a scan people learn to ignore. `-I` is correct GIVEN an
      # invariant nothing was enforcing: source files are text. This step enforces
      # the invariant instead.
      #
      # WHY A GATE AND NOT A "scanned N, skipped M" LINE. A count embedded in a
      # line whose headline number is the one you care about is a number nobody
      # reads. Riding it on a green secret-scan result would build the blind spot
      # deliberately. So: silent when there is nothing to say, and the JOB'S OWN
      # STATUS when there is.
      #
      # THE ONE GAP, AND WHAT OPENS IT: the guard reads TRACKED files, and this
      # job is `checkout` then `grep` with no install and no build, so the tree at
      # scan time IS the tracked set and the two are identical. ADD A BUILD OR
      # INSTALL STEP ABOVE THE GREP AND THAT STOPS BEING TRUE — a generated,
      # untracked, NUL-bearing file would be skipped by the grep and invisible to
      # this guard. If you are adding such a step, that is the thing to fix.
      - uses: ./.github/actions/setup-bun
        with:
          # The guard imports nothing but node builtins.
          install: "false"
      - name: No tracked source file is invisible to the scan above
        run: bun scripts/check-nul-bytes.ts

  # Single required status check named in the `main-protection` ruleset.
  # Always runs (so docs-only PRs don't trip "skipped == failed" gating)
  # and fails only when an upstream job actually failed or was cancelled.
  ci-success:
    name: CI Success
    needs:
      [
        detect-changes,
        validate-code,
        validate-deps,
        validate-docs,
        test,
        e2e,
        prod-guards-integration,
        secret-scan,
        oss-boundary,
      ]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify required jobs
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          echo "$NEEDS"
          if echo "$NEEDS" | grep -E '"result":[[:space:]]*"(failure|cancelled)"' > /dev/null; then
            echo "::error::A required CI job failed or was cancelled."
            exit 1
          fi
          echo "All required jobs passed or were skipped."

  # SC-838. THE GATE ON THE PRIVATE/PUBLIC BOUNDARY. What stood here before was
  # a pre-push hook, and a hook is not a gate: `--no-verify` skips it, a fresh
  # clone has none until `bun install` sets `core.hooksPath`, and it is
  # per-machine — measured set in one checkout and nowhere else. On 2026-09-01
  # a real leak reached MGrin/scani-oss past it, and the public history had to
  # be rewritten and force-pushed. The hook stays: a seatbelt and a gate is the
  # intended end state, not one replacing the other.
  #
  # NEVER PATH-FILTERED, and never `needs: detect-changes`. That leak travelled
  # in a SQL migration and in prose; a filter deciding this job is irrelevant to
  # a change is a filter deciding a leak is irrelevant.
  #
  # WHAT THIS JOB DELIBERATELY DOES NOT RUN, because the obvious wiring is a
  # false green. `scripts/check-oss-bound-paths.ts` asks WHICH REPO a branch
  # belongs to, and answers by diffing the two mains — so it needs both trees,
  # and a checkout of one repository has one. Measured 2026-09-02 in a clean
  # mirror-shaped clone, both arms:
  #
  #   no `upstream` remote         -> `SKIPPED · exit 0 · no upstream remote is
  #                                   configured` — a green over a tree it never
  #                                   looked at, which is the defect this job
  #                                   exists to be the opposite of
  #   `upstream` pointed at itself -> `UNKNOWN · exit 9`, permanently: the two
  #                                   mains are the same commit, so nothing
  #                                   distinguishes them
  #
  # Its PREDICATE does not port here either — "refuse a path absent from
  # `upstream/main`" is, inside the mirror, "refuse every new file". 14 of the
  # 30 landings before 2026-09-02 added at least one, so it would refuse about
  # half of all work and `OSS_ALLOW_NEW_FILES=1` would become the habit rather
  # than the exception. A guard whose escape hatch is routine is not a guard.
  # It stays a pre-commit/pre-push check, where both trees are present.
  #
  # The three CONTENT scanners have no such problem and already know this
  # repository by name: `scanScope` reads "no `upstream` remote and no
  # `.private-repo` marker" as *this checkout is the public mirror, so every
  # commit in it is public*, and scans. They are what this job runs, and they
  # are what would have caught the 2026-09-01 leak.
  #
  # A `pull_request` run executes the workflow from the PR's own merge commit,
  # so a pull request can edit this job. That is GitHub's model and is not
  # worked around here: the threat this gate is built for is an accidental
  # port, and a diff that weakens the boundary gate is visible in review.
  oss-boundary:
    name: OSS boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          # A pull request's base is unreachable at the default depth of 1.
          # Without this the range step refuses every run — loudly, and
          # uselessly.
          fetch-depth: 0
      - uses: ./.github/actions/setup-bun
        with:
          # The guards import node builtins and each other, nothing else.
          install: "false"

      # THE DELETED-GUARD HOLE. Every scan below is `bun scripts/check-oss-*`,
      # so a missing script exits non-zero — the right answer by accident rather
      # than by construction, and the wrong one the moment somebody adds an
      # `|| true`, an `if [ -f ]`, or a fourth scanner. The invariant is stated
      # once, here, in the words the hook already uses: a check that could not
      # run is not a pass.
      #
      # `check-oss-bound-paths.ts` and `lib/check-verdict.ts` are in the list
      # though nothing calls them directly — the scanners import them, so their
      # absence is the scan's absence.
      - name: The guards are present in this tree
        run: |
          set -euo pipefail
          present=0
          missing=""
          for f in check-oss-data-shapes check-oss-figures check-oss-prose check-oss-internal-refs check-oss-bound-paths lib/check-verdict; do
            if [ -f "scripts/$f.ts" ]; then
              present=$((present + 1))
            else
              missing="$missing scripts/$f.ts"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::NOTHING WAS SCANNED — absent from this tree:$missing. This is not a pass."
            exit 1
          fi
          echo "$present of 6 guard file(s) present"

      # ARM 3 OF THE MATRIX IN MGrin/scani#1374, MOVED INTO CI. Every other step
      # here is a green whenever the tree is clean, and a green from an
      # instrument nobody has watched refuse is exactly the non-result rendered
      # as a settled one that this job exists to be the opposite of. So: a
      # throwaway repository, one commit carrying a value of the shape that
      # leaked, and the real CLI. It must exit non-zero.
      #
      # IT PROVES WHAT THE SCANNERS' OWN SELF-TESTS CANNOT. Each scanner already
      # verifies its rule table and exits 10 if a rule stopped behaving, and the
      # test suite already asserts the CLI refuses. Neither reads THIS STEP. A
      # `run:` block that piped the scanner into something, or lost its status
      # to a subshell, passes every green arm above and is caught only here.
      #
      # The probe repository has no remotes and no `.private-repo`, which is how
      # `scanScope` recognises a public checkout — so the scanner scans there
      # whichever repository this job runs in, and this arm means the same thing
      # in both.
      #
      # The value is synthetic: it is the fixture
      # `scripts/tests/check-oss-figures.test.ts` already uses.
      - name: The guard can still go RED
        run: |
          set -euo pipefail
          probe="$RUNNER_TEMP/oss-boundary-probe"
          rm -rf "$probe"
          mkdir -p "$probe"
          git -C "$probe" init -q -b main
          git -C "$probe" config user.email ci@example.com
          git -C "$probe" config user.name ci
          git -C "$probe" config commit.gpgsign false
          echo seed > "$probe/seed.txt"
          git -C "$probe" add -A
          git -C "$probe" commit -qm seed
          printf "const balance = '98765.43210987';\n" > "$probe/probe.test.ts"
          git -C "$probe" add -A
          git -C "$probe" commit -qm probe
          git -C "$probe" rev-parse HEAD > "$probe/commits.txt"
          rc=0
          ( cd "$probe" && bun "$GITHUB_WORKSPACE/scripts/check-oss-figures.ts" \
              --stdin-commits < "$probe/commits.txt" ) > "$probe/out.txt" 2>&1 || rc=$?
          cat "$probe/out.txt"
          if [ "$rc" -eq 0 ]; then
            echo "::error::the figure guard did NOT refuse a commit carrying 98765.43210987, so every green in this job is uninformative — NOTHING THIS JOB REPORTS IS EVIDENCE."
            exit 1
          fi
          echo "the guard refused the probe with exit $rc — a red is reachable from this step"

      # A WHOLE-TREE ASSERTION, not a claim about this change: the public tree
      # contains no internal reference at all. It is true today — measured
      # 2026-09-02 in a mirror clone, `2252 of 2288 tracked file(s) scanned, 36
      # binary skipped, 0 internal reference(s)` — so making it a gate costs
      # nothing now and refuses the first change that adds one. It is also the
      # only arm that reads a merge commit's own content, which the added-line
      # scan below structurally cannot.
      #
      # `--scan` is this guard's only whole-tree mode and it bypasses the scope
      # question by design, so it must NOT run on the private repository, whose
      # tree carries internal references throughout. The branch is taken in
      # shell and PRINTED rather than written as a step-level `if:`: `skipped`
      # is already one word for two opposite things in this repository's CI
      # (SC-726), and a third meaning for it inside the boundary gate is not
      # worth the two saved lines.
      - name: No internal reference anywhere in the tree
        run: |
          set -euo pipefail
          if [ -f .private-repo ]; then
            echo "NOT RUN: .private-repo marks this as the private repository, whose tree carries internal references by design. This arm is the mirror's."
          else
            bun scripts/check-oss-internal-refs.ts --scan
          fi

      # THE ADDED LINES THIS CHANGE INTRODUCES — the population the pre-push
      # hook judges, asked of the repository instead of the machine.
      #
      # `check-oss-data-shapes.ts` is first because it is the one that answers
      # the question the 2026-09-01 exposure actually asked. Everything that
      # leaked was DATA — a bank account number, wallet addresses, a transaction
      # hash, 283 row identifiers — and the other two detect CLAIMS, so all of
      # them passed it. Measured over the 20 landings before 2026-09-02 it
      # refuses none: 20 green, 0 findings, after the repository's own fixture
      # convention was named in its allowlist. It has NO environment-variable
      # escape, unlike the other two.
      #
      # PULL REQUESTS ONLY, and the reason is the label below rather than cost.
      # `github.event.pull_request.labels` does not exist on a push, so the
      # assertion that cleared a pull request is unreadable from the run that
      # follows it — re-running this scan on `main` would turn every cleared
      # pull request into a permanently red `main`, which is worse than not
      # running it. Nothing is lost that this job otherwise sees: a merge commit
      # adds no lines a per-commit diff can read (below), so the push run has
      # nothing here to read that the pull-request run did not.
      #
      # `--no-merges`, and the blind spot that leaves is stated rather than
      # papered over: `git diff-tree` prints nothing for a merge commit without
      # `-m`, so feeding one to the scanner reads zero added lines and reports
      # `PASS · 0 added line(s) ... in 1 pushed commit(s)` — measured
      # 2026-09-02. Excluding merges makes the count honest about what it read.
      # A conflict resolution that ADDS a line inside a merge commit is
      # therefore invisible here; the whole-tree arm above is what covers it.
      #
      # An unresolvable base is a REFUSAL, never an empty range. Both arrive as
      # an empty commit list and only one of them is a scan.
      #
      # THE LABEL IS AN ASSERTION, NOT A MUTE BUTTON. `OSS_ALLOW_FIGURES=1` is
      # the escape the guard already documents, and applying
      # `figures-are-synthetic` to a pull request is a person saying the figures
      # in it were made up rather than taken off a real account. It is recorded
      # in the verdict line, which names every value it admitted. Measured over
      # the 20 landings before 2026-09-02, this arm refuses 2 — a rate at which
      # clearing one is a decision somebody makes, not a reflex.
      - name: Scan what this change introduces
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          OSS_ALLOW_FIGURES: ${{ contains(github.event.pull_request.labels.*.name, 'figures-are-synthetic') && '1' || '' }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
            echo "NOT RUN: event '$GITHUB_EVENT_NAME' carries no pull-request labels, so a cleared figure could not be read back and this arm would red \`main\` after every cleared pull request. The whole-tree arm above is what covers this run."
            exit 0
          fi
          if ! git rev-parse --verify --quiet "${PR_BASE}^{commit}" > /dev/null; then
            echo "::error::could not resolve the base commit '${PR_BASE}', so the range this change introduces is unknown and NOTHING WAS SCANNED. This is not a pass."
            exit 1
          fi
          git rev-list --no-merges "${PR_BASE}..HEAD" > "$RUNNER_TEMP/oss-boundary-commits.txt"
          n=$(wc -l < "$RUNNER_TEMP/oss-boundary-commits.txt" | tr -d ' ')
          echo "range ${PR_BASE}..$(git rev-parse HEAD) — $n non-merge commit(s)"
          bun scripts/check-oss-data-shapes.ts --stdin-commits < "$RUNNER_TEMP/oss-boundary-commits.txt"
          bun scripts/check-oss-figures.ts --stdin-commits < "$RUNNER_TEMP/oss-boundary-commits.txt"
          bun scripts/check-oss-prose.ts --stdin-commits < "$RUNNER_TEMP/oss-boundary-commits.txt"
