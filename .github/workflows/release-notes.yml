name: Release notes

# SC-573. release-please walks `main` in COMMITTER-DATE order and breaks the
# walk at the previous release's sha, so a branch cut before a release PR
# merged and merged after it sits behind the stop point and is never read. Its
# commits are on `main`, unreachable from the tag, and absent from the release
# notes — with no error, no warning and a green CI.
#
# Measured on 0.16.0: four releasable commits on `main`, two listed. A data-loss
# fix and a security fix were missing, and it was found by a `grep` run out of
# curiosity about something else (SC-572).
#
# This job differences the release PR's own CHANGELOG.md against
# `git log <previous tag>..<the commit the notes were generated from>`. The two
# sides are derived independently, which is the only reason a shortfall is
# visible at all. `scripts/check-release-notes.ts` carries the measurement, the
# blindness states, and the causes it deliberately only reports.
#
# SC-640. THIS RAN ON `pull_request` UNTIL 2026-08-26, AND HAD NEVER EXECUTED
# ONCE. release-please pushes the release branch with the default GITHUB_TOKEN,
# and every workflow run on a branch pushed that way landed in
# `conclusion: action_required` — created, never approved, never started.
# `gh pr checks` on the release PR reported no checks at all, and
# `action_required` reads as `status: completed`, so a run list showed three
# finished runs and hid the whole defect (the same shape as SC-488).
#
# It was not broken. Run by hand against the release commit as it stood while
# SC-638 was dropping entries, it exits 1 and names the missing commit exactly.
# It was simply never allowed to start.
#
# `workflow_run` is the remedy mgrin chose over a personal access token and over
# loosening the repository's approval setting: it executes in the DEFAULT
# BRANCH's context and is not approval-gated, so it closes the hole without
# adding a credential to rotate and without weakening a control on a public
# repository. The cost is that the result is not automatically a check on the
# pull request, so this posts a commit status itself.
#
# NOT A REQUIRED CHECK. `main-protection` requires `CI Success` alone, so this
# is red-and-visible on the release PR rather than blocking. Adding it to that
# ruleset's required contexts is a repository-settings change; scani-oss is not
# under Terraform (SC-565), so it is a manual one.

on:
  # SC-653. THIS IS NOT A REVERT OF SC-640, AND THE DIFFERENCE IS THE WHOLE
  # POINT. `pull_request` used to be how the check REACHED THE RELEASE PR, and
  # it never did — those runs are `action_required` and never start. It is now
  # how the check reports on an ORDINARY pr, where runs are not approval-gated
  # and do start. A release branch is refused on this path, below, so it can
  # never post a verdict about a release PR it did not examine.
  #
  # Why it must report at all: a required status check that no ordinary PR can
  # receive is not strict, it is IMPASSABLE. Adding this context to
  # `main-protection` on 2026-08-26 deadlocked the repository — the required
  # contexts then spanned two mutually exclusive populations, an ordinary PR
  # could never get this one and the release PR could never get the other two,
  # and all four open PRs blocked (SC-647, SC-653).
  #
  # `pull_request_target`, NOT `pull_request`, AND THE REASON IS A FORK.
  # On a pull request FROM A FORK, `pull_request` hands the job a READ-ONLY
  # `GITHUB_TOKEN`, so `createCommitStatus` answers 403, the job fails, and
  # the context never appears on the head. Requiring it would then block every
  # fork contribution — on a repository whose CONTRIBUTING.md tells people to
  # fork. That is the SC-647 defect exactly, one population over: a required
  # check an entire population structurally cannot receive.
  #
  # `pull_request_target` runs in the BASE repository's context and does have
  # a write token. It is dangerous in general because it pairs write
  # credentials with a contributor's code — and it is safe HERE only because
  # this path never checks out or executes that code. The one checkout step
  # is reachable solely at `mode: check`, which this trigger cannot produce:
  # an ordinary branch resolves to `reported` and a release branch to
  # `silent`. That step additionally refuses this event outright, and
  # `release-notes-workflow.test.ts` fails if either guard is removed.
  #
  # SO: DO NOT ADD A CHECKOUT, A BUILD, OR ANY STEP THAT RUNS REPOSITORY CODE
  # TO THIS PATH. It would execute a stranger's branch with a write token.
  pull_request_target:
    types: [opened, reopened, synchronize]
  workflow_run:
    workflows: ["Release Please"]
    # `completed`, not `completed && success`. The failure this exists for is a
    # release-please run that SUCCEEDS and regenerates nothing (SC-638), so
    # gating on its conclusion would skip the exact case.
    types: [completed]
  # The must-be-FOUND control, kept permanently runnable. Point it at a release
  # commit known to be short and watch it go red — `6e86a6b81` is the one from
  # SC-638, and a guard nobody has seen refuse is one nobody has seen work.
  workflow_dispatch:
    inputs:
      head:
        description: "Release commit sha to check instead of the open release PR's head"
        required: false
        type: string

permissions:
  contents: read
  pull-requests: read
  statuses: write

# Keyed per pull request rather than globally: a single `release-notes` group
# made every PR's run queue behind every other PR's, and on this repo runs on a
# release branch sit unapproved for a long time. `github.ref` is distinct per
# PR and constant across a `workflow_run`, so the release chain keeps one slot.
concurrency:
  group: release-notes-${{ github.event.pull_request.number || 'release-chain' }}
  cancel-in-progress: false

jobs:
  check:
    name: Release notes cover every releasable commit
    runs-on: ubuntu-latest
    steps:
      - id: target
        name: Find the release commit to check
        uses: actions/github-script@v7
        with:
          script: |
            // An ordinary pull request: nothing to compare, and saying so IS
            // the job. `mode: reported` posts a passing status so the context
            // always exists on the head, which is what makes it safe to
            // require. A RELEASE branch arriving here is refused rather than
            // passed — that run is `action_required` and will not start, and
            // if it ever did, a blanket success about the one population this
            // check exists for is the worst thing it could say.
            if (context.eventName === 'pull_request_target') {
              const ref = context.payload.pull_request.head.ref;
              const sha = context.payload.pull_request.head.sha;
              if (ref.startsWith('release-please--')) {
                core.info(`${ref} is a release branch; the workflow_run chain owns it. Posting nothing.`);
                core.setOutput('mode', 'silent');
                return;
              }
              core.info(`${ref} is not a release branch — nothing to cover. Reporting on ${sha}.`);
              core.setOutput('sha', sha);
              core.setOutput('mode', 'reported');
              return;
            }

            const dispatched = (context.payload.inputs && context.payload.inputs.head || '').trim();
            if (dispatched) {
              // Expanded, not used as typed. `actions/checkout` and the statuses
              // API both refuse an abbreviated sha — checkout dies and
              // createCommitStatus answers 422 `Sha must be a valid hex object
              // ID`. Measured on the first control run of this file, dispatched
              // at `6e86a6b81`. Resolving through the API also accepts a tag or
              // a branch name, which a hex-length check would have rejected.
              let resolved;
              try {
                const commit = await github.rest.repos.getCommit({
                  owner: context.repo.owner, repo: context.repo.repo, ref: dispatched,
                });
                resolved = commit.data.sha;
              } catch (error) {
                core.setFailed(`dispatched head \`${dispatched}\` does not resolve to a commit in this repository: ${error.message}`);
                return;
              }
              core.info(`dispatched: ${dispatched} resolves to ${resolved}`);
              core.setOutput('sha', resolved);
              core.setOutput('mode', 'check');
              return;
            }
            const open = await github.rest.pulls.list({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', per_page: 100,
            });
            // The same-repository condition is what stops a fork naming a
            // branch `release-please--anything` to get its head checked out.
            const release = open.data.filter((pr) =>
              pr.head.ref.startsWith('release-please--') &&
              pr.head.repo && pr.head.repo.full_name === `${context.repo.owner}/${context.repo.repo}`);
            // The denominator, so "nothing to check" cannot read like a pass
            // that examined something.
            core.info(`open pull requests: ${open.data.length}; release pull requests: ${release.length}`);
            if (release.length === 0) {
              core.info('no open release pull request — nothing to check.');
              core.setOutput('mode', 'silent');
              return;
            }
            if (release.length > 1) {
              core.setFailed(`${release.length} open release pull requests; this job does not know which to check.`);
              return;
            }
            core.info(`checking ${release[0].html_url} at ${release[0].head.sha}`);
            core.setOutput('sha', release[0].head.sha);
            core.setOutput('mode', 'check');

      # The second guard on the fork path, deliberately redundant with
      # `mode == 'check'` being unreachable from that trigger. Redundant
      # because the cost of the two disagreeing is executing a contributor's
      # branch with a write token, and a guard that depends on a script above
      # it staying correct is not the guard you want for that.
      - if: steps.target.outputs.mode == 'check' && github.event_name != 'pull_request_target'
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          # The release commit itself, whose single parent is exactly what
          # release-please generated these notes from.
          ref: ${{ steps.target.outputs.sha }}
          # The whole history and every tag. A shallow checkout cannot reach
          # the previous release tag, and "no previous tag" reads exactly like
          # a repository that has never released — which is why the script
          # exits 3 there rather than passing.
          fetch-depth: 0
          fetch-tags: true

      - if: steps.target.outputs.mode == 'check' && github.event_name != 'pull_request_target'
        uses: ./.github/actions/setup-bun
        with:
          # The check imports nothing but git.
          install: "false"

      - id: check
        if: steps.target.outputs.mode == 'check' && github.event_name != 'pull_request_target'
        name: Every releasable commit has a release note
        # Not `set -e`: the exit code IS the result, and it has to survive to
        # the status step. Reading `$?` unpiped rather than grepping the text.
        run: |
          set +e
          bun scripts/check-release-notes.ts --head "$TARGET_SHA" 2>&1 | tee out.txt
          rc=${PIPESTATUS[0]}
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          {
            echo '```'
            head -c 60000 out.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"
        env:
          TARGET_SHA: ${{ steps.target.outputs.sha }}

      # `always()`, because the whole point is that the release PR carries a
      # visible verdict. A workflow_run job is not a check on the pull request,
      # so without this the result lives somewhere nobody looks — which is the
      # bug this file exists to close, one level up.
      - if: always() && steps.target.outputs.mode != 'silent'
        name: Report the verdict onto the head commit
        uses: actions/github-script@v7
        with:
          script: |
            const mode = '${{ steps.target.outputs.mode }}';
            if (mode === 'reported') {
              await github.rest.repos.createCommitStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                sha: '${{ steps.target.outputs.sha }}',
                state: 'success',
                context: 'Release notes cover every releasable commit',
                description: 'Not a release pull request — no release notes to cover',
                target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              });
              return;
            }
            const rc = '${{ steps.check.outputs.rc }}';
            const state = rc === '0' ? 'success' : 'failure';
            // An EMPTY rc is the check step never having run — a step above it
            // failed, or the job was cancelled. It is not a shortfall, and
            // saying it is sends the reader hunting for a missing changelog
            // entry that does not exist. Measured: the first control run of
            // this file reported `A releasable commit has no entry` for a run
            // whose checkout had died, which is this workflow's own bug
            // reproduced inside it.
            const description = rc === '0'
              ? 'Every releasable commit has a release note'
              : rc === ''
                ? 'BLIND — the check never ran; this is not a pass'
                : rc === '3'
                  ? 'BLIND — no comparison was made; this is not a pass'
                  : 'A releasable commit has no entry in the release notes';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: '${{ steps.target.outputs.sha }}',
              state,
              context: 'Release notes cover every releasable commit',
              description: description.slice(0, 140),
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
