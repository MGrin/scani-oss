name: Coverage

# Runs on every push to main. Generates lcov.info via `bun test --coverage`,
# computes line coverage %, and writes the result to a public gist via
# Schneegans/dynamic-badges-action. The README badge points at that gist
# through shields.io's `?url=https://gist.../...json` endpoint.
#
# One-time setup outside this workflow:
#   1. Create a public gist (any filename) and copy its ID from the URL.
#   2. Generate a fine-grained PAT with the `gist` scope only.
#   3. Add the PAT as repo secret `GIST_SECRET`.
#   4. Add the gist ID as repo variable `COVERAGE_GIST_ID`.
#
# PRs are intentionally excluded — fork PRs cannot read repo secrets, and
# updating the badge from a PR would clobber main's coverage number.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    name: Compute + publish coverage
    runs-on: ubuntu-latest
    # Mirror secrets to job-level env so step-level `if:` can compare. GitHub
    # disallows referencing `secrets.X` directly inside `if:`.
    env:
      GIST_SECRET: ${{ secrets.GIST_SECRET }}
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: scani
          POSTGRES_PASSWORD: scani
          POSTGRES_DB: scani
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U scani -d scani"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      # FULL HISTORY, for the same reason ci.yml's `test` job takes it (SC-884).
      # This step runs the same `bun run test`, and part of that suite derives a
      # base from real git history — `git rev-parse <sha>^`, `HEAD~5`. At the
      # default depth of 1 those exit 128, and a job that cannot resolve a
      # parent commit is red on every commit forever.
      #
      # It is not a hypothetical (SC-937): the two jobs once disagreed on one
      # head in the same minute — ci.yml's `Test` at depth 0 green, this job at
      # depth 1 red — and by then this workflow had gone 200 consecutive runs
      # without a single success. Nobody noticed, because a gate that is red on
      # every commit cannot answer the one question it exists for, so nobody
      # reads it. SC-884 put the setting on ci.yml and left this file behind.
      #
      # NOT `fetch-depth: <N>`: any N is a timer that goes off later as a
      # confusing red on an unrelated change. Depth 0 costs ~2s of a job whose
      # test step alone is ~180s.
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-bun

      - name: Run DB migrations
        run: bun run db:migrate
        env:
          DATABASE_URL: postgres://scani:scani@localhost:5433/scani?sslmode=disable

      - name: Test with coverage
        # `bun test --coverage` emits coverage/lcov.info; HTML render is
        # local-only and skipped in CI.
        run: bun run test --coverage --coverage-reporter=lcov --coverage-dir=coverage
        env:
          NODE_ENV: test
          DATABASE_URL: postgres://scani:scani@localhost:5433/scani?sslmode=disable

      - name: Generate badge JSON
        run: bun scripts/coverage-badge.ts

      - name: Read badge fields
        # Surfaces `message` and `color` to subsequent steps without
        # making them parse JSON inline.
        id: badge
        run: |
          set -eu
          message=$(jq -r '.message' coverage/badge.json)
          color=$(jq -r '.color' coverage/badge.json)
          echo "message=$message" >> "$GITHUB_OUTPUT"
          echo "color=$color" >> "$GITHUB_OUTPUT"

      - name: Upload badge to gist
        # Skipped when secret/var aren't configured yet, so the workflow
        # stays green before the one-time setup is done.
        if: ${{ env.GIST_SECRET != '' && vars.COVERAGE_GIST_ID != '' }}
        uses: Schneegans/dynamic-badges-action@e9a478b16159b4d31420099ba146cdc50f134483 # v1.7.0
        with:
          auth: ${{ secrets.GIST_SECRET }}
          gistID: ${{ vars.COVERAGE_GIST_ID }}
          filename: scani-coverage.json
          label: coverage
          message: ${{ steps.badge.outputs.message }}
          color: ${{ steps.badge.outputs.color }}
          forceUpdate: true

  # SC-949. THE ALARM, and the only job here that exists to reach a person.
  #
  # This workflow's verdict lands on an already-merged commit and gates nothing
  # — there is no `pull_request` trigger, so it cannot be a required check, and
  # `deploy-fly.yaml` chains off `Terraform` rather than off this. It was red
  # for 200 consecutive runs back to 2026-08-26T19:59:45Z with zero successes
  # and nobody noticed. Not a quiet signal: a loud one that had been loud long
  # enough to read as furniture.
  #
  # mgrin chose the transition alarm over the two alternatives on 2026-09-06.
  # Leaving it advisory is what produced the outage; a `pull_request` trigger
  # plus a required check costs a second full suite run on every PR on top of
  # `ci.yml`'s, and required checks are not available on this repo's plan at all
  # (`branches/main/protection` and `/rulesets` both 403 "Upgrade to GitHub Pro
  # or make this repository public"). So: **red HAVING BEEN GREEN**, which is
  # the reading that carries information, and nothing else.
  #
  # IT MUST NOT FIRE ON STATE (SC-726). A red that was already red carries
  # nothing new, and an alarm that repeats itself is switched off inside a week
  # — after which the repository is worse off than under the silence it
  # replaced. The prior verdict comes from this workflow's own run history and
  # `scripts/coverage-transition.ts` decides; it walks past `cancelled` runs,
  # which `cancel-in-progress` above produces routinely, and it REFUSES (exit 9,
  # no alert) rather than inferring a state it could not read. "No history" is
  # never read as "was green".
  #
  # THE CHANNEL IS AN ISSUE, NOT A RED JOB. The run is already red when this
  # job runs, so a second red job adds nothing that was not there for the
  # previous 200. An issue is assigned — which notifies the assignee whether or
  # not they watch the repository — and persists until somebody closes it,
  # unlike a workflow-failure email that has already proved skippable here.
  # This job's OWN colour reports the alarm's health: green when it decided
  # correctly (fired or stayed silent), red only when it could not decide.
  #
  # Guarded by `scripts/tests/coverage-alerts-on-transition.test.ts`.
  coverage-went-red:
    name: Coverage went red having been green
    needs: coverage
    if: ${{ always() && needs.coverage.result == 'failure' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
      - uses: ./.github/actions/setup-bun
        with:
          # The detector imports `node:fs` and nothing else. Installing the
          # monorepo to run it would put a ~15s dependency install on the alarm
          # path, which is the last path that should be able to fail slowly.
          install: "false"

      - name: Fetch this workflow's own run history
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -uo pipefail
          # Resolved from the CURRENT RUN rather than from the filename, so
          # renaming this file cannot blind the detector while leaving it
          # confidently answering.
          wf_id=$(gh api "repos/${REPO}/actions/runs/${RUN_ID}" -q '.workflow_id')
          for attempt in 1 2 3; do
            if gh api "repos/${REPO}/actions/workflows/${wf_id}/runs?branch=main&per_page=60" \
                 > runs.json 2> fetch.err; then
              exit 0
            fi
            echo "attempt ${attempt} failed: $(head -1 fetch.err)"
            sleep 5
          done
          # A transport failure is not a state. Leave `runs.json` unusable and
          # let the detector refuse rather than guessing.
          echo '{}' > runs.json

      - name: Decide whether this is a transition
        id: transition
        run: bun scripts/coverage-transition.ts --runs runs.json --run-id "${{ github.run_id }}"

      - name: Open an issue naming the transition
        if: ${{ steps.transition.outputs.verdict == 'transition' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ github.sha }}
          PRIOR_URL: ${{ steps.transition.outputs.prior_run_url }}
          PRIOR_AT: ${{ steps.transition.outputs.prior_run_at }}
        run: |
          set -euo pipefail
          short="${SHA:0:9}"
          title="Coverage went red having been green (${short})"

          # EVENT IDEMPOTENCY, NOT STATE SUPPRESSION. Re-running this same run
          # re-evaluates the same transition and would open a second identical
          # issue — one event, two alerts, which is the repetition this alarm
          # exists to avoid. A LATER commit going red after a green is a
          # different event, has a different sha, and still fires.
          existing=$(gh issue list --repo "$REPO" --state all --limit 5 \
            --search "in:title \"${title}\"" --json number,title \
            --jq "[.[] | select(.title == \"${title}\")] | length" 2>/dev/null || echo 0)
          if [ "${existing:-0}" -gt 0 ]; then
            echo "::notice title=Already alerted::an issue already names ${short}; not opening a second"
            exit 0
          fi

          cat > body.md <<BODY
          @${OWNER} — the \`Coverage\` workflow just went **red having been green**.

          | | |
          |---|---|
          | this run | ${RUN_URL} |
          | commit | \`${SHA}\` |
          | last green run | ${PRIOR_URL} (${PRIOR_AT}) |

          **This fires once per transition, not once per red run.** You will get
          nothing further until Coverage goes green and red again — an alarm that
          repeated itself would be switched off inside a week (SC-726), which is how
          this workflow managed 200 consecutive red runs unnoticed (SC-937, SC-949).

          Coverage gates nothing by design: there is no \`pull_request\` trigger, so
          nothing was blocked and nothing needs unblocking. What is lost while this
          is red is the badge number and the suite's own coverage reading.

          Close this issue when it is dealt with; nothing closes it automatically.
          BODY

          gh issue create --repo "$REPO" \
            --title "$title" \
            --body-file body.md \
            --assignee "$OWNER"

      - name: Report what was read
        if: ${{ always() }}
        env:
          VERDICT: ${{ steps.transition.outputs.verdict }}
        run: |
          set -uo pipefail
          {
            echo "## Coverage transition alarm"
            echo
            echo "verdict: \`${VERDICT:-unreadable}\`"
            echo
            echo "- \`transition\` — red having been green. An issue was opened and assigned."
            echo "- \`still-red\` — the previous verdict was already red. Silent on purpose."
            echo "- \`no-prior-verdict\` — nothing before this run ever concluded. Silent:"
            echo "  no history is not the same as having been green."
            echo "- \`blind\` — the run list could not be read, or did not contain this run."
            echo "  Nothing was inferred and no issue was opened; this job is red instead."
          } >> "$GITHUB_STEP_SUMMARY"
