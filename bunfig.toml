# Bun runtime config — applies to `bun`, `bun test`, and `bun build` invocations
# from anywhere inside this monorepo.

[install]
# Match the linker every Dockerfile already uses (`bun install --linker=hoisted`),
# so local trees resolve exactly like the deployed ones.
#
# The default isolated linker builds `node_modules/.bun/<pkg>/node_modules/`
# symlink sets, and it only ever verifies the package *store* — never those
# links. Lose one (an interrupted install, a partial `rm -rf`) and every later
# `bun install` reports "no changes" while the tree stays broken; only
# `rm -rf node_modules` or `--force` rebuilds it. That is how `http-errors@2.0.1`
# lost its `statuses@2.0.2` link and crashed the data-provider at boot (SC-96).
# Hoisted nests real directories instead of symlinks, and a plain `bun install`
# repairs a partial tree.
linker = "hoisted"

[test]
# Every typedi-decorated `@Service()` class needs reflect-metadata loaded
# before its first reference; the domain preload also sets a default
# `DATABASE_URL` pointing at the docker-compose Postgres on :5433. Wiring
# this here means plain `bun test` works repo-wide without each invocation
# having to remember `--preload`. The `bun run test` script still passes
# `--preload` explicitly, which is harmless (idempotent).
preload = ["./packages/business/domain/test-preload.ts"]

# DO NOT ADD `timeout` HERE. Bun reads this section and silently DROPS that
# key, so the line is inert and the comment above it used to promise a safety
# net that never existed (SC-694). `preload` above is the control: it comes
# from this same section and does work, which is what rules out "bun ignores
# this file" and makes the claim about the key specific.
#
# Measured 2026-08-27, bun 1.3.14: an 8s test under a bare `bun test <path>`
# dies at 5000.10ms. `testTimeout`, `test-timeout` and `defaultTimeout` are
# ignored too, so there is no spelling to reach for.
#
# The budget has THREE working homes. This comment said "exactly two" until
# SC-737 measured the third, and the third was standing four lines above it the
# whole time: `preload` was cited as the control proving bun reads this section,
# and nobody asked what else a preload could do. A claim about the SET of homes,
# written while fixing one of them.
#   - `packages/business/domain/test-preload.ts`, preloaded by the line above,
#     calls `setDefaultTimeout(30_000)`. This is the one that covers everything:
#     it reaches every test file under every invocation, so no file has to know
#     it is expensive and nothing has to enumerate which ones are (SC-737).
#   - `package.json`'s `test` script, which passes `--timeout 30000` on argv.
#     That is what `bun run test` and the gate get, and always did.
#   - `setDefaultTimeout(30_000)` from `bun:test`, at the top of one file.
#     Still correct, and eight files still carry it. Redundant now rather than
#     wrong: a per-file call beats a budget that depends on a preload somebody
#     may later scope differently.
#
# `scripts/tests/test-timeout-budget.test.ts` fails if this comes back.
